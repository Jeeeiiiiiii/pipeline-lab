# One ExternalSecret -> one Kubernetes Secret with one key per entry in
# values.externalSecrets.env. ESO fetches each from Secrets Manager through
# the SecretStore and keeps the Secret in sync on refreshInterval.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.name" . }}-secrets
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: SecretStore
  target:
    name: {{ include "app.name" . }}-secrets
    creationPolicy: Owner
  data:
  {{- range $env, $remote := .Values.externalSecrets.env }}
    - secretKey: {{ $env }}
      remoteRef:
        key: {{ $remote }}
  {{- end }}
