# How the cluster authenticates to Secrets Manager.
#
# Locally: static keys in a Kubernetes Secret (the emulator accepts "test").
# In AWS: delete the `auth` block and annotate the operator's ServiceAccount
# with an IAM role (IRSA); everything else here stays the same.
#
# One SecretStore per namespace that needs secrets, each scoped to that
# namespace -- a ClusterSecretStore would let any namespace read any secret.
---
apiVersion: v1
kind: Namespace
metadata:
  name: app
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: app
stringData:
  access-key: test
  secret-key: test
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: monitoring
stringData:
  access-key: test
  secret-key: test
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: app
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-key
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: monitoring
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-key
---
# Grafana's admin credentials. The Secrets Manager value is a JSON object
# with the two keys the chart expects; dataFrom.extract spreads them into
# the Secret's keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: pipeline-lab/grafana/admin
