# External Secrets Operator: watches ExternalSecret resources, fetches from
# the provider named in their SecretStore, writes Kubernetes Secrets.
#
# The AWS endpoint override is the local-only part: in AWS the operator
# talks to the real Secrets Manager. Locally, pods cannot resolve the
# emulator by name, so platform-up.sh substitutes its IP here.
installCRDs: true
replicaCount: 1
webhook:
  replicaCount: 1
certController:
  replicaCount: 1
extraEnv:
  - name: AWS_SECRETSMANAGER_ENDPOINT
    value: "http://FLOCI_IP:4566"
  - name: AWS_STS_ENDPOINT
    value: "http://FLOCI_IP:4566"
resources:
  requests:
    cpu: 20m
    memory: 64Mi
